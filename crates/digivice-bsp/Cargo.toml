[package]
name = "digivice-bsp"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Board Support Package (BSP) for Waveshare ESP32-C6-LCD-1.28 in pure Rust (#![no_std])"

[dependencies]
digivice-core = { path = "../digivice-core" }

esp-hal = { version = "~1.2.2", features = ["esp32c6", "unstable"] }
esp-storage = { version = "0.10.0", features = ["esp32c6", "embedded-storage"] }
esp-println = { version = "0.18.0", default-features = false, features = [
  "colors",
  "critical-section",
  "esp32c6",
  "jtag-serial",
] }

critical-section      = "1.2.0"
static_cell           = "2.1.1"
nb                    = "1.1.0"
embedded-hal          = "1.0.0"
embedded-hal-bus      = "0.3.0"
embedded-graphics     = "0.8.1"
display-interface     = "0.5.0"
display-interface-spi = "0.5.0"
gc9a01 = { package = "gc9a01-rs", version = "0.4.2" }
