[workspace]
resolver = "2"
members = [
  "crates/digivice-core",
  "crates/digivice-bsp",
  "crates/digivice-firmware",
]

[profile.dev]
# When build speed is not a concern, keep dev firmware highly optimized for smooth MCU execution
opt-level = "s"
panic     = "abort"
lto       = "thin"

[profile.release]
codegen-units   = 1       # LLVM performs whole-program optimization in a single translation unit
debug           = 1       # Line-tables only: adequate for backtraces while preventing symbol bloat
lto             = 'fat'   # Cross-crate link-time optimization and dead code elimination
opt-level       = 's'     # Optimizes for dense code size + execution speed with minimal I-cache thrashing
split-debuginfo = "off"   # Suppress macOS host dsymutil invocation on cross-compiled RISC-V ELF binaries
panic         = "abort" # Eliminate unwinding landing pads and personality routines
