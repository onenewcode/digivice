[package]
edition = "2024"
name    = "island"
version = "0.1.0"

[[bin]]
name = "island"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32c6", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c6",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c6"] }
esp-alloc = { version = "0.11.0", features = ["esp32c6"] }
esp-println = { version = "0.18.0", default-features = false, features = [
  "colors",
  "critical-section",
  "esp32c6",
  "jtag-serial",
] }

# Embassy Async Runtime
embassy-executor = { version = "0.10.0", features = [] }
embassy-time     = "0.5.0"
embassy-sync     = "0.6.2"
embassy-futures  = "0.1.1"

# Hardware Abstraction & Utilities
critical-section  = "1.2.0"
static_cell       = "2.1.1"
heapless          = "0.8.0"
embedded-hal      = "1.0.0"
embedded-hal-bus  = "0.3.0"
embedded-io-async = "0.7.0"
nb                = "1.1.0"
libm              = "0.2.11"

# Display & Storage
embedded-graphics     = "0.8.1"
display-interface     = "0.5.0"
display-interface-spi = "0.5.0"
gc9a01 = { package = "gc9a01-rs", version = "0.4.2" }
esp-storage = { version = "0.10.0", features = ["esp32c6"] }

# 2.4GHz Radio (BLE Support)
esp-radio = { version = "1.0.0-beta.1", features = [
  "ble",
  "esp-alloc",
  "esp32c6",
  "unstable",
] }
trouble-host = { version = "=0.7.0", default-features = false, features = [
  "scan",
  "default-packet-pool",
] }
bt-hci = "=0.9.0"

[profile.dev]
# When build speed is not a concern, keep dev firmware highly optimized for smooth MCU execution
opt-level = "s"
panic     = "abort"
lto       = "thin"

[profile.release]
codegen-units = 1       # LLVM performs whole-program optimization in a single translation unit
debug         = 1       # Line-tables only: adequate for backtraces while preventing symbol bloat
lto           = 'fat'   # Cross-crate link-time optimization and dead code elimination
opt-level     = 's'     # Optimizes for dense code size + execution speed with minimal I-cache thrashing
panic         = "abort" # Eliminate unwinding landing pads and personality routines
